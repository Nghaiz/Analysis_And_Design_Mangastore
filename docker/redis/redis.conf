# Mount: ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro (compose.yaml, service redis).
# Mật khẩu KHÔNG nằm ở đây: compose chạy redis-server <file này> --requirepass "$REDIS_PASSWORD".
# Redis chỉ trong mạng compose (không mở cổng ra máy); giữ session Tomcat qua Redisson.

bind 0.0.0.0
port 6379
protected-mode yes

dir /data

# AOF để session còn sau khi restart container; fsync mỗi giây (mất tối đa khoảng 1 giây ghi).
appendonly yes
appendfsync everysec
appenddirname "appendonlydir"

# Session không được tự xoá khi đầy bộ nhớ: báo lỗi ghi thay vì evict.
maxmemory-policy noeviction

loglevel notice
