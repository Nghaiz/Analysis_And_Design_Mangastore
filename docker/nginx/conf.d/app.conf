# Site duy nhất: proxy tới app:8080, ảnh bìa từ covers_data (contract.md §3, §6, §10).

# "resolve" (nginx OSS từ 1.27.3) đọc lại IP của app qua DNS nội bộ của Docker (127.0.0.11): container app
# đổi IP sau "docker compose up --build" hay restart thì nginx vẫn tới được, không cần restart nginx.
upstream app_backend {
    zone      app_backend 64k;
    resolver  127.0.0.11 valid=10s ipv6=off;
    server    app:8080 resolve;
    keepalive 16;
}

server {
    listen       80;
    server_name  _;

    include /etc/nginx/snippets/security-headers.conf;

    # Lỗi nginx tự trả trước khi tới Tomcat (đường dẫn có %-encoding hỏng như /%zz, dòng request hay header quá
    # dài, thân quá client_max_body_size): trang tĩnh tiếng Việt cùng giao diện error.jsp thay trang mặc định tiếng
    # Anh, giữ nguyên mã (error_page không có "="). 494 là mã nội bộ của nginx cho header quá lớn, gửi ra là 400.
    # Lỗi 4xx/5xx do Tomcat trả thì error.jsp và các trang error/*.jsp lo, nginx không chặn (không proxy_intercept_errors).
    error_page 400 /__tiem-loi/400.html;
    error_page 494 =400 /__tiem-loi/400.html;
    error_page 413 /__tiem-loi/413.html;
    error_page 414 /__tiem-loi/414.html;

    location ^~ /__tiem-loi/ {
        alias       /usr/share/nginx/tiem-loi/;
        include     /etc/nginx/snippets/security-headers.conf;
        add_header  Cache-Control "no-store" always;
    }

    # Healthcheck của compose: curl -fsS http://127.0.0.1/nginx-health | grep -q ok
    location = /nginx-health {
        access_log    off;
        default_type  text/plain;
        return        200 "ok\n";
    }

    # File build của Vite có hash trong tên: cache dài, bất biến.
    location /static/assets/ {
        include            /etc/nginx/snippets/proxy-app.conf;
        proxy_hide_header  Cache-Control;
        include            /etc/nginx/snippets/security-headers.conf;
        add_header         Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /static/ {
        include /etc/nginx/snippets/proxy-app.conf;
    }

    # Trình duyệt tự xin /favicon.ico (nhất là với trang text/plain như /health.jsp): trả biểu tượng tự vẽ
    # trong đầu ra Vite thay vì 404 (phase 1, lane 1D phát hiện).
    location = /favicon.ico {
        access_log         off;
        rewrite            ^ /static/img/favicon.svg break;
        include            /etc/nginx/snippets/proxy-app.conf;
        proxy_hide_header  Cache-Control;
        include            /etc/nginx/snippets/security-headers.conf;
        add_header         Cache-Control "public, max-age=86400" always;
    }

    # Ảnh bìa: /covers/{bookId}/cover-{w}.webp|avif nằm ở /srv/covers (volume covers_data, chỉ đọc).
    # URL này khớp mặc định APP_COVERS_BASE_URL=/covers; đổi biến đó thì phải đổi location này.
    location /covers/ {
        root        /srv;
        try_files   $uri @cover_fallback;
        include     /etc/nginx/snippets/security-headers.conf;
        add_header  Cache-Control "public, max-age=31536000" always;
    }

    # Thiếu file bìa: trả bìa giấy vẽ sẵn của app với mã 200. Cache ngắn để bìa thật xuất hiện khi đã có file.
    location @cover_fallback {
        rewrite            ^ /static/img/cover-fallback.svg break;
        include            /etc/nginx/snippets/proxy-app.conf;
        proxy_hide_header  Cache-Control;
        include            /etc/nginx/snippets/security-headers.conf;
        add_header         Cache-Control "public, max-age=300" always;
    }

    location / {
        include /etc/nginx/snippets/proxy-app.conf;
    }
}
