# Proxy tới Tomcat (service app). Include trong mọi location chuyển tiếp tới app.
proxy_pass          http://app_backend;
proxy_http_version  1.1;
proxy_set_header    Connection "";
proxy_set_header    Host $http_host;
proxy_set_header    X-Real-IP $remote_addr;
proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header    X-Forwarded-Proto $scheme;
proxy_set_header    X-Forwarded-Host $http_host;
# app luôn trả bản không nén; nginx tự nén gzip/brotli theo Accept-Encoding của trình duyệt.
proxy_set_header    Accept-Encoding "";
# Header bảo mật chỉ đến từ nginx (snippets/security-headers.conf), tránh trùng nếu app cũng đặt.
proxy_hide_header   Content-Security-Policy;
proxy_hide_header   X-Content-Type-Options;
proxy_hide_header   Referrer-Policy;
proxy_hide_header   Permissions-Policy;
