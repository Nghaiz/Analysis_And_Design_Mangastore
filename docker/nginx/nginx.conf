# nginx chính (contract.md §3, §10). Module brotli build trong docker/nginx/Dockerfile.
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    # Nén văn bản, kể cả phản hồi proxy từ app (contract.md §10). text/html luôn được nén nên không liệt kê
    # (liệt kê lại thì nginx cảnh báo "duplicate MIME type"). Tomcat trả .js là text/javascript.
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    5;
    gzip_min_length    256;
    gzip_types         text/css text/javascript application/javascript application/json
                       application/manifest+json image/svg+xml text/plain text/xml application/xml;

    brotli             on;
    brotli_comp_level  5;
    brotli_min_length  256;
    brotli_types       text/css text/javascript application/javascript application/json
                       application/manifest+json image/svg+xml text/plain text/xml application/xml;

    include /etc/nginx/conf.d/*.conf;
}
