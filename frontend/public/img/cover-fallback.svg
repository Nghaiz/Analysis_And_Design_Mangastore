  <g stroke="#5C4A36" stroke-width="1.5" opacity="0.35">
    <line x1="60" y1="300" x2="280" y2="300"/>
    <line x1="60" y1="330" x2="280" y2="330"/>
    <line x1="60" y1="360" x2="240" y2="360"/>
  </g>
  <rect x="96" y="170" width="150" height="86" fill="none" stroke="#A3221B" stroke-width="4" transform="rotate(-6 171 213)"/>
