# Header bảo mật (contract.md §10). add_header chỉ kế thừa khi location không có add_header riêng, nên mọi
# location có add_header riêng phải include lại file này. "always" để cả phản hồi 4xx/5xx cũng có header.
# CSP không viết ở đây: docker-entrypoint.d/30-tiem-csp.sh sinh csp.conf lúc container khởi động, theo
# APP_VITE_DEV (mặc định CSP phase 1 của contract.md §10; APP_VITE_DEV=true thì thêm origin của Vite dev server).
include /etc/nginx/snippets/csp.conf;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
