# CI của dự án (phase-08-e2e-ci-hoan-thien.md lane 8B, phase-08-integration.md §3).
# Mỗi job chạy đúng lệnh tại máy của AGENTS.md §3, để chạy lại được trên máy (Deferred #25).
# Không có paths: (check bắt buộc bị lọc theo đường dẫn sẽ treo ở "Expected — Waiting").
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Accept phase 8 đọc hai dòng này bằng regex và chạy đúng hai ảnh đó tại máy. Mỗi biến một dòng.
  ACTIONLINT_VERSION: "1.7.12"
  TRIVY_VERSION: "0.76.2"
  JAVA_VERSION: "25"
  NODE_VERSION: "24"
  # Test cần Docker (Testcontainers mysql:8.4.13). pom.xml chưa tách unit/integration (một surefire, không
  # failsafe, không @Tag), nên job unit loại các mẫu này và job integration chỉ chạy chúng (cú pháp -Dtest của surefire).
  IT_TESTS: "vn/tiemtruyen/dao/*Test.java,**/SchemaConformanceTest.java,**/DaoTransactionTest.java,**/MigrationListenerTest.java"
  E2E_PROJECT: tiemtruyen-e2e
  SMOKE_COMPOSE_PROJECT: tiemtruyen-e2e
  SMOKE_BASE_URL: http://127.0.0.1:8080

jobs:
  lint:
    name: lint (Checkstyle, ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Checkstyle
        run: node scripts/dev/mvnw.mjs -B -ntp checkstyle:check
      - name: ESLint
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run lint

  build-unit:
    name: build và unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend typecheck, test, build
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run typecheck
          npm --prefix frontend run test
          npm --prefix frontend run build
      - name: Maven package, unit test (không Testcontainers)
        run: node scripts/dev/mvnw.mjs -B -ntp package "-Dtest=!${IT_TESTS//,/,!}" -Dsurefire.failIfNoSpecifiedTests=false

  integration:
    name: integration (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Maven test (DAO, schema, migration trên mysql:8.4.13)
        run: node scripts/dev/mvnw.mjs -B -ntp test "-Dtest=${IT_TESTS}" -Dsurefire.failIfNoSpecifiedTests=false

  checks:
    name: hợp đồng tài liệu (section10-sync, scripts/check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check/section10-sync.mjs
      - run: node --test "scripts/check/*.test.mjs"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: actionlint (đúng ảnh Accept chạy tại máy)
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo "rhysd/actionlint:${ACTIONLINT_VERSION}" -no-color

  build-image:
    name: build image (app, nginx)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Tạo .env (compose bắt buộc biến kể cả khi chỉ build)
        run: node scripts/dev/make-env.mjs
      - name: docker compose build
        run: docker compose build app nginx
      - name: Lưu ảnh cho job E2E và Trivy
        run: docker save -o images.tar tiemtruyen-app:local tiemtruyen-nginx:local
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: images
          path: images.tar
          retention-days: 1
          if-no-files-found: error

  trivy:
    name: Trivy (HIGH, CRITICAL đã có bản sửa)
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: images
      - run: docker load -i images.tar
      - name: trivy image (cùng tham số với Accept bước 7)
        run: |
          for img in tiemtruyen-app:local tiemtruyen-nginx:local; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
              "aquasec/trivy:${TRIVY_VERSION}" image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$img"
          done

  e2e:
    name: E2E (Playwright mobile, desktop; Lighthouse)
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Chạy đúng các lệnh của Accept phase 8 bước 2–5, không gọi thẳng script: bước 4 của Accept đặt CI='' (tắt
    # reporter html và forbidOnly), còn CI cần e2e/playwright-report để tải lên khi lỗi và cần chặn test.only.
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/download-artifact@v8.0.2
        with:
          name: images
      - run: docker load -i images.tar && rm images.tar
      - name: Tạo .env
        run: node scripts/dev/make-env.mjs
      - name: Gói e2e và Chromium (Accept bước 2)
        run: |
          npm --prefix e2e ci
          cd e2e && npx playwright install --with-deps chromium
      - name: Stack E2E (Accept bước 3, ảnh đã build ở job build-image)
        run: |
          docker compose -p "$E2E_PROJECT" -f compose.yaml -f compose.e2e.yaml up --no-build -d --wait --wait-timeout 300
          curl -fsS "${SMOKE_BASE_URL}/health.jsp"
      - name: Playwright (Accept bước 4)
        working-directory: e2e
        run: npx playwright test
      - name: Lighthouse mobile ≥ 90 (Accept bước 5)
        working-directory: e2e
        run: node lighthouse/run-lighthouse.mjs --base-url "$SMOKE_BASE_URL" --json
      - name: Log compose khi lỗi
        if: failure()
        run: docker compose -p "$E2E_PROJECT" -f compose.yaml -f compose.e2e.yaml logs --no-color app nginx db
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
